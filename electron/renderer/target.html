<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>woofy · pick a spot</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.18);
        overflow: hidden;
        cursor: crosshair;
        -webkit-user-select: none;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #banner {
        position: fixed;
        top: 26px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 14px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        letter-spacing: 0.2px;
      }
      #ring {
        position: fixed;
        left: 0;
        top: 0;
        width: 38px;
        height: 38px;
        margin-left: -19px;
        margin-top: -19px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.4);
        pointer-events: none;
      }
      #dot {
        position: fixed;
        left: 0;
        top: 0;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        margin-top: -3px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="banner">click where to walk · esc or right-click to cancel</div>
    <div id="ring"></div>
    <div id="dot"></div>
    <script>
      const ring = document.getElementById('ring');
      const dot = document.getElementById('dot');
      function moveCursor(x, y) {
        ring.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        dot.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      }
      document.addEventListener('mousemove', (e) => moveCursor(e.clientX, e.clientY));
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          if (window.woofy) window.woofy.walkToCancel();
          return;
        }
        if (e.button !== 0) return;
        if (window.woofy) window.woofy.walkToPick(e.screenX, e.screenY);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (window.woofy) window.woofy.walkToCancel();
        }
      });
      // Initial position so the ring isn't at (0,0) before first move.
      moveCursor(window.innerWidth / 2, window.innerHeight / 2);
    </script>
  </body>
</html>
